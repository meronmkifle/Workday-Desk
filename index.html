<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Workday Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: two tabbed infinite boards (Whiteboard, Stickies). Slim top bar with tabs, floating tool rail on the left, properties pill top centre, draggable Pomodoro card. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --ink:#17202A; --muted:#5B6878; --line:#D6DCE4;
  --accent:#2B57D0; --accent-ink:#FFFFFF; --accent-soft:#E1E8FA; --hi:#FFE45C; --ok:#2F8A5B; --danger:#C93C3C;
  --canvas:#F7F8FA; --canvas-st:#EFEAE0; --dot:rgba(60,75,95,.22);
  --c-ink:#1B2430; --c-blue:#2B57D0; --c-red:#D23B3B; --c-green:#23875A; --c-orange:#E07B10; --c-purple:#7B4CC2;
  --st-yellow:#FFEB8A; --st-orange:#FFD3A3; --st-pink:#FFC9D6; --st-lilac:#E0D3FF; --st-blue:#BFE0FF; --st-teal:#B5EDE4; --st-green:#C8F0C9; --st-grey:#E3E6EA; --st-ink:#2A2620;
  --shadow:0 1px 2px rgba(20,30,50,.08),0 8px 24px rgba(20,30,50,.10);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hand:"Kalam","Comic Sans MS","Segoe Print",cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161C; --surface:#19202A; --surface-2:#212934; --ink:#E5EAF0; --muted:#97A3B1; --line:#2C3542;
  --accent:#7D9DFF; --accent-ink:#0E1420; --accent-soft:#25314F; --hi:#D9C23A; --ok:#6CC296; --danger:#F07171;
  --canvas:#151B22; --canvas-st:#1A1915; --dot:rgba(200,215,235,.14);
  --c-ink:#E8EDF3; --c-blue:#86A5FF; --c-red:#FF7A7A; --c-green:#6CD29E; --c-orange:#FFB054; --c-purple:#C19BFF;
  --st-yellow:#EAD872; --st-orange:#E8BC8A; --st-pink:#E9B3C0; --st-lilac:#C9BCEB; --st-blue:#A9CBEA; --st-teal:#9FD6CC; --st-green:#B3DBB4; --st-grey:#C9CED5; --st-ink:#1E1B16;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161C; --surface:#19202A; --surface-2:#212934; --ink:#E5EAF0; --muted:#97A3B1; --line:#2C3542;
  --accent:#7D9DFF; --accent-ink:#0E1420; --accent-soft:#25314F; --hi:#D9C23A; --ok:#6CC296; --danger:#F07171;
  --canvas:#151B22; --canvas-st:#1A1915; --dot:rgba(200,215,235,.14);
  --c-ink:#E8EDF3; --c-blue:#86A5FF; --c-red:#FF7A7A; --c-green:#6CD29E; --c-orange:#FFB054; --c-purple:#C19BFF;
  --st-yellow:#EAD872; --st-orange:#E8BC8A; --st-pink:#E9B3C0; --st-lilac:#C9BCEB; --st-blue:#A9CBEA; --st-teal:#9FD6CC; --st-green:#B3DBB4; --st-grey:#C9CED5; --st-ink:#1E1B16;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;white-space:nowrap}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.bar{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--hi);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#1A1A1A;transform:rotate(-4deg)}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:800;white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.tab{display:flex;align-items:center;gap:7px;border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab svg{width:16px;height:16px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tab .n{font-family:var(--f-mono);font-size:11px;background:var(--surface-2);border-radius:10px;padding:0 6px;color:var(--muted)}
.tab[aria-selected="true"] .n{background:var(--accent-soft);color:var(--accent)}
.bar .sp{flex:1}
.ex{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:8px;padding:4px 6px 4px 10px;font-size:13px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-weight:700;white-space:nowrap;font-size:13.5px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn .emo-i{font-size:15px;line-height:1}
.ib{border:0;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);padding:0;flex:none}
.ib:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:18px;height:18px}
.zoom{font-family:var(--f-mono);font-size:12.5px;min-width:52px}
.bar-group{display:flex;align-items:center;gap:2px}

/* stage */
.stage{position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);touch-action:none;user-select:none;-webkit-user-select:none}
.stage[data-tab="stickies"]{background-color:var(--canvas-st)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage[data-tool="pen"],.stage[data-tool="hl"],.stage[data-tool="rect"],.stage[data-tool="ellipse"],.stage[data-tool="arrow"],.stage[data-tool="sticky"]{cursor:crosshair}
.stage[data-tool="text"]{cursor:text}
.stage[data-tool="hand"],.stage.panning{cursor:grab}
.stage.grabbing{cursor:grabbing}
.stage[data-tool="eraser"]{cursor:none}
.stage.dropping{box-shadow:inset 0 0 0 3px var(--accent)}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
.layer .item{pointer-events:auto}
.stage:not([data-tool="select"]) .layer .item{pointer-events:none}
.empty-hint{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none;max-width:calc(100% - 32px)}
.empty-hint b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);margin-bottom:4px}

/* tool rail */
.rail{position:absolute;left:14px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow);max-height:calc(100% - 24px);overflow-y:auto}
.tool{position:relative;border:0;background:none;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--muted);padding:0;flex:none}
.tool svg{width:20px;height:20px}
.tool:hover{background:var(--surface-2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tool kbd{position:absolute;right:3px;bottom:2px;font-family:var(--f-mono);font-size:9px;opacity:.6}
.rail hr{border:0;border-top:1px solid var(--line);margin:3px 4px}

/* props pill */
.props{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 8px;box-shadow:var(--shadow);max-width:calc(100% - 32px);overflow-x:auto}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;flex:none;background:var(--c)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.sw.sq{border-radius:6px}
.custom{position:relative;width:24px;height:24px;border-radius:6px;flex:none;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:conic-gradient(#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c77dff,#ff6b6b);cursor:pointer}
.custom[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.custom input{position:absolute;inset:-6px;width:40px;height:40px;opacity:0;cursor:pointer;border:0;padding:0}
.sz{width:30px;height:30px;border:0;border-radius:8px;background:none;display:grid;place-items:center;flex:none;padding:0}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{background:var(--accent-soft)}
.props .div{width:1px;height:22px;background:var(--line);flex:none}
.props input[type=search]{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 9px;width:150px;flex:none}
.props .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.props .hint{font-size:12.5px;color:var(--muted);white-space:nowrap}

/* stickies + text items */
.sticky{position:absolute;display:flex;flex-direction:column;background:var(--c);color:var(--sti,var(--st-ink));border-radius:3px;box-shadow:0 2px 3px rgba(0,0,0,.12),0 10px 22px rgba(0,0,0,.12);resize:both;overflow:hidden;min-width:150px;min-height:110px}
.sticky.drag{box-shadow:0 6px 10px rgba(0,0,0,.18),0 22px 40px rgba(0,0,0,.22)}
.grip{display:flex;align-items:center;gap:3px;padding:4px 5px;cursor:grab;touch-action:none;background:rgba(0,0,0,.06)}
.grip .dot{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(0,0,0,.3);padding:0;background:var(--c);flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.grip .gsp{flex:1}
.grip .x{border:0;background:none;color:inherit;opacity:.55;width:22px;height:22px;border-radius:4px;padding:0;font-size:16px;line-height:1;flex:none}
.grip .x:hover{opacity:1;background:rgba(0,0,0,.08)}
.grip .gb{border:0;background:none;color:inherit;opacity:.5;width:24px;height:22px;border-radius:4px;padding:0;display:grid;place-items:center;flex:none}
.grip .gb svg{width:14px;height:14px}
.grip .gb:hover,.grip .gb.on{opacity:1;background:rgba(0,0,0,.08)}
.grip .due{border:0;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;background:rgba(255,255,255,.45);color:inherit;white-space:nowrap;flex:none}
.grip .due.today{background:#F3B23A;color:#2A1D00}
.grip .due.over{background:#C93C3C;color:#FFFFFF}
.sticky.done{filter:saturate(.45)}
.sticky.done textarea{text-decoration:line-through;opacity:.6}
.sticky.dim{opacity:.22}
.sticky.hit{outline:3px solid var(--accent);outline-offset:3px}
.sticky.focusing{outline:3px solid var(--ok);outline-offset:3px}
.sticky textarea{flex:1;border:0;background:none;resize:none;padding:4px 12px 12px;color:inherit;font-family:var(--f-hand);font-size:18px;line-height:1.35;outline:none;user-select:text;-webkit-user-select:text}
.sticky textarea::placeholder{color:inherit;opacity:.5}
.tally{position:absolute;left:10px;bottom:5px;font-family:var(--f-mono);font-size:11px;opacity:.7;pointer-events:none;white-space:nowrap}
.text-item{position:absolute;white-space:pre;font-family:var(--f-display);font-weight:600;line-height:1.15;padding:2px 4px;border-radius:4px;min-width:20px;cursor:move;outline:none;user-select:text;-webkit-user-select:text}
.text-item[contenteditable="true"]{cursor:text;box-shadow:0 0 0 1.5px var(--accent);background:color-mix(in srgb,var(--canvas) 80%,transparent)}
.text-item.sel{box-shadow:0 0 0 1.5px var(--accent)}

/* popovers */
.pop{position:absolute;z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:var(--shadow)}
.pal{display:grid;grid-template-columns:repeat(5,26px);gap:6px}
.pal .label{grid-column:1/-1}
.duepop{display:flex;flex-direction:column;gap:4px;min-width:190px}
.duepop button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;display:flex;justify-content:space-between;gap:12px}
.duepop button:hover{background:var(--surface-2)}
.duepop button span{color:var(--muted);font-size:12.5px}
.duepop input{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 8px;margin-top:4px}
.emo{width:312px;max-width:calc(100% - 16px)}
.emo-tabs{display:flex;gap:2px;margin-bottom:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.emo-tabs button{border:0;background:none;border-radius:6px;padding:3px 6px;font-size:16px;line-height:1.2;opacity:.6}
.emo-tabs button[aria-pressed="true"]{background:var(--accent-soft);opacity:1}
.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:220px;overflow-y:auto}
.emo-grid button{border:0;background:none;font-size:21px;line-height:1;padding:5px 0;border-radius:6px}
.emo-grid button:hover{background:var(--surface-2)}
.emo-foot{font-size:11.5px;color:var(--muted);margin-top:6px}

/* timer */
.timer{position:absolute;right:16px;bottom:16px;z-index:6;width:272px;max-width:calc(100% - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:calc(100% - 24px);overflow-y:auto}
.timer.dragging{box-shadow:0 2px 4px rgba(0,0,0,.12),0 20px 44px rgba(0,0,0,.22)}
.t-head{display:flex;align-items:center;gap:6px;padding:8px 8px 0 10px;cursor:grab;touch-action:none}
.timer.dragging .t-head{cursor:grabbing}
.t-grip{width:10px;height:16px;flex:none;background-image:radial-gradient(var(--muted) 1.2px,transparent 1.4px);background-size:5px 5px;opacity:.7}
.t-head h2{font-family:var(--f-display);font-size:16px;font-weight:800;margin:0;flex:1;white-space:nowrap}
.t-body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 14px 14px}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ring{position:relative;width:150px;aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.face{font-family:var(--f-mono);font-size:38px;line-height:1;letter-spacing:-.02em}
.face-sub{position:absolute;bottom:34px;font-size:11.5px;color:var(--muted)}
.t-body input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;font-size:13.5px;text-align:center}
.t-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.cycle{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.cycle i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.cycle i.on{background:var(--accent);border-color:var(--accent)}
.week{width:100%}
.week-bars{display:flex;gap:6px;align-items:flex-end;height:46px;margin-top:4px}
.week-bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.week-bars b{display:block;width:100%;background:var(--accent-soft);border-radius:3px;min-height:3px}
.week-bars .today b{background:var(--accent)}
.week-bars .today{color:var(--ink)}
.t-set{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.t-set label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);font-weight:700}
.t-set input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 6px;font-family:var(--f-mono)}
.t-set .full{grid-column:1/-1;flex-direction:row;align-items:center;gap:6px}
.t-set input[type=range]{flex:1;accent-color:var(--accent)}
.timer.min{width:auto}
.timer.min .t-body{display:none}
.timer.min .t-head{padding:6px 6px 6px 10px}
.timer.min h2{font-family:var(--f-mono);font-weight:500;font-size:15px}
.timer.run{border-color:var(--accent)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,15,25,.45);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px}
.modal-box h2{font-family:var(--f-display);font-size:20px;margin:0 0 8px}
.modal-box h3{font-size:13px;margin:16px 0 6px}
.modal-box p{color:var(--muted);margin:0 0 12px}
.modal-box textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px;font-family:var(--f-mono);font-size:12px}
.m-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.tpl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tpl-grid button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.tpl-grid button b{display:block}
.tpl-grid button span{font-size:12.5px;color:var(--muted)}
.tpl-grid button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.arch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.arch li{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.arch .swd{width:14px;height:14px;border-radius:4px;flex:none;margin-top:3px;background:var(--c);border:1px solid rgba(0,0,0,.2)}
.arch .at{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.arch .at small{display:block;color:var(--muted);font-size:12px;white-space:normal}
.arch .acts{display:flex;gap:4px;flex:none}
.empty{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;align-items:center;gap:10px}

@media (max-width:760px){
  .brand b,.hide-sm{display:none}
  .bar{padding:6px 10px;gap:6px}
  .tab{padding:5px 9px}
  .rail{top:auto;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);flex-direction:row;max-width:calc(100% - 24px);overflow-x:auto;overflow-y:hidden}
  .rail hr{border-top:0;border-left:1px solid var(--line);margin:4px 3px}

<script>
(function(){
const KEY='workday-desk-board-v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey(new Date());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const shortDate=k=>parseKey(k).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const INKS=['ink','blue','red','green','orange','purple'];
const STICKY=['yellow','orange','pink','lilac','blue','teal','green','grey'];
const SIZES=[2,5,10];
const TEXT_PX={2:20,5:30,10:48,20:72};

/* ---------- sticky colour helpers ---------- */
const isHex=c=>/^#[0-9a-f]{6}$/i.test(c||'');
const stBg=c=>isHex(c)?c:`var(--st-${STICKY.includes(c)?c:'yellow'})`;
function stInk(c){if(!isHex(c))return 'var(--st-ink)';const n=parseInt(c.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};const L=.2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255);return L>.36?'#1E1B16':'#F7F5F0'}
const stName=c=>isHex(c)?'Custom':c[0].toUpperCase()+c.slice(1);
function dueLabel(k){if(!k)return'';const t=today();if(k===t)return'Today';if(k===addDays(t,1))return'Tomorrow';if(k===addDays(t,-1))return'Yesterday';return shortDate(k)}
function dueState(it){if(!it.due||it.done)return'';const t=today();return it.due<t?'over':it.due===t?'today':''}
function setDone(it,v){const was=!!it.done;it.done=!!v;if(v&&!was)it.doneAt=Date.now();if(!v)delete it.doneAt;return v&&!was}

/* ---------- state ---------- */
function seed(){
  const t=today();
  const circ=[];for(let i=0;i<=40;i++){const a=i/40*Math.PI*2+0.3;circ.push([520+Math.cos(a)*(118+Math.sin(i*1.7)*3),150+Math.sin(a)*(64+Math.cos(i*1.3)*3)]);}
  const hl=[];for(let i=0;i<=20;i++)hl.push([60+i*14,330+Math.sin(i/3)*1.5]);
  const yest=Date.now()-86400e3;
  return {v:3,example:true,tab:'draw',
    boards:{
      draw:{view:{x:80,y:60,z:1},template:null,items:[
        {id:uid(),ex:true,type:'text',x:60,y:20,color:'ink',size:10,text:'Q4 plan sketch \u{1F680}'},
        {id:uid(),ex:true,type:'rect',color:'blue',size:2,x1:60,y1:110,x2:280,y2:200},
        {id:uid(),ex:true,type:'text',x:80,y:135,color:'blue',size:5,text:'Research'},
        {id:uid(),ex:true,type:'arrow',color:'ink',size:5,x1:290,y1:155,x2:395,y2:155},
        {id:uid(),ex:true,type:'stroke',tool:'pen',color:'red',size:5,pts:circ},
        {id:uid(),ex:true,type:'text',x:458,y:130,color:'red',size:5,text:'Draft'},
        {id:uid(),ex:true,type:'stroke',tool:'hl',color:'orange',size:5,pts:hl},
        {id:uid(),ex:true,type:'text',x:60,y:310,color:'ink',size:2,text:'Deadline: Friday 3pm ⏰'}
      ]},
      stickies:{view:{x:60,y:50,z:1},lanes:false,items:[
        {id:uid(),ex:true,type:'sticky',x:0,y:0,w:210,h:160,color:'yellow',text:'Ship the Q4 doc draft by 3pm',pomos:2,due:t},
        {id:uid(),ex:true,type:'sticky',x:240,y:0,w:210,h:160,color:'pink',text:'Ask IT about the VPN drop-outs \u{1F41B}',due:addDays(t,-1)},
        {id:uid(),ex:true,type:'sticky',x:480,y:0,w:210,h:160,color:'teal',text:'Waiting on: legal sign-off for vendor contract'},
        {id:uid(),ex:true,type:'sticky',x:0,y:190,w:210,h:160,color:'lilac',text:'Team lunch idea:\nthe new ramen place \u{1F35C}',due:addDays(t,2)},
        {id:uid(),ex:true,type:'sticky',x:240,y:190,w:210,h:160,color:'#7FB3FF',text:'Custom colours work too. Click the colour dot on any sticky.'},
        {id:uid(),ex:true,type:'sticky',x:480,y:190,w:210,h:160,color:'green',text:'Send weekly status update',done:true,doneAt:Date.now()-3600e3}
      ]}
    },
    tools:{draw:'pen',stickies:'select'},
    props:{color:'ink',size:5,sticky:'yellow'},
    timer:{focus:25,short:5,long:15,auto:false,sound:true,tick:true,min:false,label:'',pos:null,sticky:null},
    sound:{on:true,vol:.6},
    sessions:{},images:{},recentEmoji:[],
    archive:[
      {id:uid(),ex:true,text:'Book meeting room for Thursday review',color:'blue',doneAt:yest,archivedAt:yest},
      {id:uid(),ex:true,text:'Reply to Priya about budget sign-off',color:'yellow',doneAt:yest-7200e3,archivedAt:yest,pomos:1}
    ]
  };
}
function normalize(d){
  const s=seed();
  if(!d||typeof d!=='object')return s;
  if(Array.isArray(d.items)&&!d.boards){
    const v=Object.assign({x:0,y:0,z:1},d.view||{});
    d.boards={draw:{items:d.items.filter(i=>i.type!=='sticky'),view:v},stickies:{items:d.items.filter(i=>i.type==='sticky'),view:{...v}}};
    d.tools={draw:(d.tool&&d.tool!=='sticky')?d.tool:'pen',stickies:'select'};
    delete d.items;delete d.view;delete d.tool;
  }
  if(!d.boards||!d.boards.draw||!d.boards.stickies)return s;
  ['draw','stickies'].forEach(k=>{d.boards[k].items=Array.isArray(d.boards[k].items)?d.boards[k].items:[];d.boards[k].view=Object.assign({x:0,y:0,z:1},d.boards[k].view||{})});
  d.tab=d.tab==='stickies'?'stickies':'draw';
  d.tools=Object.assign({},s.tools,d.tools||{});
  d.props=Object.assign({},s.props,d.props||{});
  d.timer=Object.assign({},s.timer,d.timer||{});
  d.sound=Object.assign({},s.sound,d.sound||{});
  d.sessions=d.sessions||{};d.images=d.images||{};d.recentEmoji=Array.isArray(d.recentEmoji)?d.recentEmoji:[];
  d.archive=Array.isArray(d.archive)?d.archive:[];
  const used=new Set(d.boards.draw.items.filter(i=>i.type==='image').map(i=>i.img));
  Object.keys(d.images).forEach(k=>{if(!used.has(k))delete d.images[k]});
  return d;
}
function wire(o){
  ['items','view'].forEach(k=>Object.defineProperty(o,k,{configurable:true,get(){return o.boards[o.tab][k]},set(v){o.boards[o.tab][k]=v}}));
  Object.defineProperty(o,'tool',{configurable:true,get(){return o.tools[o.tab]},set(v){o.tools[o.tab]=v}});
  return o;
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
S=wire(normalize(S));
let saveT,quotaWarned=false;
function save(now){clearTimeout(saveT);const go=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));quotaWarned=false}catch(e){if(!quotaWarned){quotaWarned=true;toast('Browser storage is full, so recent changes aren’t being saved. Delete some images or archived stickies.')}}};if(now)go();else saveT=setTimeout(go,300)}

/* ---------- sounds ---------- */
let actx=null;
function audio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}return actx}
document.addEventListener('pointerdown',audio,{capture:true});
function tone(f,t0,dur,type,g){const a=actx;if(!a||!S.sound.on||S.sound.vol<=0)return;try{const st=a.currentTime+t0,o=a.createOscillator(),gn=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,st);const v=Math.max(.0002,(g||.2)*S.sound.vol);gn.gain.setValueAtTime(.0001,st);gn.gain.exponentialRampToValueAtTime(v,st+.01);gn.gain.exponentialRampToValueAtTime(.0001,st+dur);o.connect(gn).connect(a.destination);o.start(st);o.stop(st+dur+.03)}catch(e){}}
const SFX={
  done(){tone(880,0,.14,'sine',.22);tone(1318.5,.08,.3,'sine',.2)},
  undone(){tone(660,0,.1,'sine',.12);tone(494,.07,.14,'sine',.1)},
  pop(){tone(620,0,.07,'sine',.12);tone(930,.03,.06,'sine',.06)},
  start(){tone(523.3,0,.12,'triangle',.2);tone(659.3,.09,.12,'triangle',.2);tone(784,.18,.25,'triangle',.22)},
  pause(){tone(440,0,.1,'triangle',.15);tone(349.2,.08,.16,'triangle',.12)},
  focusEnd(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.16,.55,'sine',.22))},
  breakEnd(){[659.3,523.3,659.3,784].forEach((f,i)=>tone(f,i*.17,.35,'triangle',.2))},
  count(){tone(880,0,.08,'sine',.14)},
  tick(alt){tone(alt?1150:1500,0,.022,'square',.03)}
};
function renderSnd(){const on=S.sound.on;$('#sndBtn').innerHTML=on?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';$('#sndBtn').title=on?'Sounds on (click to mute)':'Sounds muted (click to unmute)';$('#sndBtn').setAttribute('aria-label',on?'Mute sounds':'Unmute sounds')}
$('#sndBtn').onclick=()=>{S.sound.on=!S.sound.on;save();renderSnd();if(S.sound.on){audio();SFX.pop()}};

/* ---------- undo (per board) ---------- */
const HIST={draw:{u:[],r:[]},stickies:{u:[],r:[]}};
const hist=()=>HIST[S.tab];
const snap=()=>JSON.stringify(S.items);
function pushUndo(s){const h=hist();h.u.push(s||snap());if(h.u.length>100)h.u.shift();h.r=[];updUndo()}
function updUndo(){$('#undoBtn').disabled=!hist().u.length;$('#redoBtn').disabled=!hist().r.length}
function undo(){const h=hist();if(!h.u.length)return;h.r.push(snap());S.items=JSON.parse(h.u.pop());sel.clear();afterBulk()}
function redo(){const h=hist();if(!h.r.length)return;h.u.push(snap());S.items=JSON.parse(h.r.pop());sel.clear();afterBulk()}
function afterBulk(){save();renderLayer();draw();updUndo();updEmpty();renderProps()}

/* ---------- toast / modal ---------- */
let toastT;
function toast(msg,undoFn){const el=$('#toast');el.innerHTML=esc(msg)+(undoFn?' <button class="btn sm" id="tUndo">Undo</button>':'');el.hidden=false;clearTimeout(toastT);if(undoFn)$('#tUndo').onclick=()=>{undoFn();el.hidden=true};toastT=setTimeout(()=>el.hidden=true,undoFn?5000:2600)}
function openModal(html){closePops();$('#modalBox').innerHTML=html;$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true;$('#modalBox').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ---------- colours from tokens ---------- */
let COL={};
function readColors(){const cs=getComputedStyle(document.documentElement);INKS.forEach(k=>COL[k]=cs.getPropertyValue('--c-'+k).trim());['accent','muted','line','surface'].forEach(k=>COL[k]=cs.getPropertyValue('--'+k).trim());COL.fg=cs.getPropertyValue('--ink').trim();draw()}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- tools ---------- */
const TOOLDEF={
 select:['V','Select, lasso and move','<path d="M5 3l14 7.5-6.2 1.8L10 19z"/>'],
 hand:['H','Pan the board','<path d="M8 13V6a1.5 1.5 0 013 0v5M11 11V4.5a1.5 1.5 0 013 0V11M14 11V6a1.5 1.5 0 013 0v8a6 6 0 01-6 6h-.5a6 6 0 01-4.8-2.4L3.5 15a1.5 1.5 0 012.4-1.8L8 15"/>'],
 pen:['P','Pen','<path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/>'],
 hl:['L','Highlighter','<path d="M9 14l-5 5h6l2-2"/><path d="M9 14l7.5-10 4 3L13 17z"/>'],
 eraser:['E','Eraser','<path d="M8 20h12"/><path d="M4.5 15.5l9-9 6 6-7.5 7.5H8.5z"/><path d="M10 10l6 6"/>'],
 rect:['R','Rectangle','<rect x="4" y="6" width="16" height="12" rx="1.5"/>'],
 ellipse:['O','Ellipse','<ellipse cx="12" cy="12" rx="8.5" ry="6.5"/>'],
 arrow:['A','Arrow','<path d="M5 19L19 5M10 5h9v9"/>'],
 text:['T','Text','<path d="M5 7V5h14v2M12 5v14M9 19h6"/>'],
 sticky:['S','Place a sticky','<path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/>']
};
const TABTOOLS={draw:['select','hand','-','pen','hl','eraser','-','rect','ellipse','arrow','-','text','img','-','tpl'],stickies:['select','hand','-','sticky']};
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
function renderRail(){
  $('#rail').innerHTML=TABTOOLS[S.tab].map(t=>{if(t==='-')return '<hr>';
    if(t==='tpl')return `<button class="tool" data-tpl="1" aria-pressed="${!!S.boards.draw.template}" title="Background template" aria-label="Background template">${svg('<rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M12 3.5v17M3.5 12h17" stroke-dasharray="2 2.5"/>')}</button>`;
    if(t==='img')return `<button class="tool" data-img="1" title="Add an image (or paste a screenshot with Ctrl+V)" aria-label="Add image">${svg('<rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-9 8"/>')}</button>`;
    const d=TOOLDEF[t];return `<button class="tool" data-tool="${t}" aria-pressed="${S.tool===t}" title="${d[1]} (${d[0]})" aria-label="${d[1]}">${svg(d[2])}<kbd>${d[0]}</kbd></button>`}).join('');
}
const EMO_BTN='<button class="btn sm" data-pa="emoji" title="Emoji: adds to the text you’re typing" aria-label="Insert emoji"><span class="emo-i">\u{1F60A}</span></button>';
function renderProps(){
  const t=S.tool,p=S.props,el=$('#props');
  if(S.tab==='stickies'){
    const custom=isHex(p.sticky),doneN=S.items.filter(i=>i.done).length;
    el.hidden=false;
    el.innerHTML='<span class="label">New sticky</span>'+STICKY.map(c=>`<button class="sw sq" style="--c:var(--st-${c})" data-sticky="${c}" aria-pressed="${p.sticky===c}" aria-label="${c}" title="${stName(c)}"></button>`).join('')+
      `<label class="custom" aria-pressed="${custom}" title="Custom colour"><input type="color" id="newStCustom" value="${custom?p.sticky:'#7fb3ff'}" aria-label="Custom sticky colour"></label>`+
      '<span class="div"></span><button class="btn sm primary" data-pa="add">Add sticky</button><button class="btn sm" data-pa="tidy">Tidy</button>'+
      `<button class="btn sm" data-pa="lanes" aria-pressed="${!!S.boards.stickies.lanes}" title="To do, Doing, Done columns">Lanes</button>`+
      `<button class="btn sm" data-pa="archive" title="Archive finished stickies and see past ones">Archive${doneN?` <span class="mono">${doneN}</span>`:''}</button>`+EMO_BTN+
      `<span class="div"></span><input type="search" id="stSearch" placeholder="Search stickies (Ctrl+F)" value="${esc(query)}" aria-label="Search stickies"><span class="cnt" id="stCount"></span>`;

  let h='';

/* ---------- view ---------- */
const stage=$('#stage'),cv=$('#cv'),ctx=cv.getContext('2d'),layer=$('#layer');
let W=0,H=0,DPR=1,R={left:0,top:0};
function resize(){const r=stage.getBoundingClientRect();R=r;W=r.width;H=r.height;DPR=window.devicePixelRatio||1;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);applyView();placeTimer()}
new ResizeObserver(resize).observe(stage);
function applyView(){
  const v=S.view;layer.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;
  const g=24*v.z;stage.style.backgroundSize=`${g}px ${g}px`;stage.style.backgroundPosition=`${v.x}px ${v.y}px`;
  $('#zoomLbl').textContent=Math.round(v.z*100)+'%';draw();save();
}
const toWorld=(cx,cy)=>({x:(cx-R.left-S.view.x)/S.view.z,y:(cy-R.top-S.view.y)/S.view.z});
function zoomAt(sx,sy,nz){const v=S.view;nz=clamp(nz,.15,4);const wx=(sx-v.x)/v.z,wy=(sy-v.y)/v.z;v.z=nz;v.x=sx-wx*nz;v.y=sy-wy*nz;closePops();applyView()}
$('#zoomIn').onclick=()=>zoomAt(W/2,H/2,S.view.z*1.2);
$('#zoomOut').onclick=()=>zoomAt(W/2,H/2,S.view.z/1.2);
$('#zoomLbl').onclick=()=>zoomAt(W/2,H/2,1);
$('#fitBtn').onclick=fit;
function bbox(it){
  if(it.type==='stroke'){let a=1e9,b=1e9,c=-1e9,d=-1e9;it.pts.forEach(([x,y])=>{a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)});const p=(it.tool==='hl'?it.size*2:it.size/2);return[a-p,b-p,c+p,d+p]}
  if(it.type==='sticky'||it.type==='image')return[it.x,it.y,it.x+it.w,it.y+it.h];
  if(it.type==='text'){const el=layer.querySelector(`[data-id="${it.id}"]`);const w=el?el.offsetWidth:100,h=el?el.offsetHeight:30;return[it.x,it.y,it.x+w,it.y+h]}
  return[Math.min(it.x1,it.x2),Math.min(it.y1,it.y2),Math.max(it.x1,it.x2),Math.max(it.y1,it.y2)];
}
function unionBox(list){let a=1e9,b=1e9,c=-1e9,d=-1e9;list.forEach(([x0,y0,x1,y1])=>{a=Math.min(a,x0);b=Math.min(b,y0);c=Math.max(c,x1);d=Math.max(d,y1)});return[a,b,c,d]}
function fit(){
  closePops();
  const boxes=S.items.map(bbox),bg=bgBox();if(bg)boxes.push(bg);
  if(!boxes.length){S.view={x:W/2,y:H/2,z:1};applyView();return}
  const[a,b,c,d]=unionBox(boxes);
  const pad=80,z=clamp(Math.min((W-pad*2)/Math.max(1,c-a),(H-pad*2)/Math.max(1,d-b)),.15,2);
  S.view={z,x:(W-(c-a)*z)/2-a*z,y:(H-(d-b)*z)/2-b*z};applyView();
}

/* ---------- images ---------- */
const IMG={};
function imgEl(it){const src=S.images[it.img];if(!src)return null;let im=IMG[it.img];if(!im){im=new Image();im.onload=()=>draw();im.src=src;IMG[it.img]=im}return im.complete&&im.naturalWidth?im:null}
function addImageFile(file,p){
  if(!file||!/^image\//.test(file.type)){toast('That file isn’t an image');return}
  if(S.tab!=='draw'){setTab('draw');p=null}
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const max=1400,sc=Math.min(1,max/Math.max(im.width,im.height)),cw=Math.round(im.width*sc),ch=Math.round(im.height*sc);
    const c=document.createElement('canvas');c.width=cw;c.height=ch;const g=c.getContext('2d');g.drawImage(im,0,0,cw,ch);
    let out=c.toDataURL('image/webp',.85);if(!out.startsWith('data:image/webp'))out=c.toDataURL('image/jpeg',.85);
    const png=c.toDataURL('image/png');if(png.length<out.length)out=png;
    const key=uid();S.images[key]=out;
    const w=Math.min(cw,640),h=Math.round(w*ch/cw);p=p||toWorld(R.left+W/2,R.top+H/2);
    pushUndo();const it={id:uid(),type:'image',img:key,x:Math.round(p.x-w/2),y:Math.round(p.y-h/2),w,h};S.items.push(it);
    S.tool='select';stage.dataset.tool='select';sel=new Set([it.id]);renderRail();renderProps();save();draw();updEmpty();
    toast(`Image added (${Math.max(1,Math.round(out.length/1024))} KB). Draw over it with the pen.`);
  };im.onerror=()=>toast('Couldn’t read that image');im.src=r.result};
  r.readAsDataURL(file);
}
$('#imgFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)addImageFile(f);e.target.value=''});
document.addEventListener('paste',e=>{
  if(!$('#modal').hidden)return;
  const items=[...(e.clipboardData&&e.clipboardData.items||[])].filter(i=>i.type.startsWith('image/'));
  if(!items.length)return;
  const a=document.activeElement;if(a&&(a.tagName==='INPUT'))return;
  e.preventDefault();addImageFile(items[0].getAsFile());
});
stage.addEventListener('dragover',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();stage.classList.add('dropping')}});
stage.addEventListener('dragleave',()=>stage.classList.remove('dropping'));
stage.addEventListener('drop',e=>{stage.classList.remove('dropping');const f=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/'));if(!f)return;e.preventDefault();addImageFile(f,S.tab==='draw'?toWorld(e.clientX,e.clientY):null)});

/* ---------- drawing ---------- */
let rafP=false,sel=new Set(),cursor=null,action=null;
function draw(){if(rafP)return;rafP=true;requestAnimationFrame(()=>{rafP=false;paint()})}
function strokePath(pts){
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  if(pts.length<3){pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));return}
  for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;ctx.quadraticCurveTo(pts[i][0],pts[i][1],mx,my)}
  const l=pts[pts.length-1];ctx.lineTo(l[0],l[1]);
}
function paintItem(it){
  if(it.type==='image'){const im=imgEl(it);if(im)ctx.drawImage(im,it.x,it.y,it.w,it.h);else{ctx.fillStyle=COL.line;ctx.fillRect(it.x,it.y,it.w,it.h)}return}
  const col=COL[it.color]||COL.ink;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=1;
  if(it.type==='stroke'){
    const w=it.tool==='hl'?it.size*4:it.size;ctx.lineWidth=w;if(it.tool==='hl'){ctx.globalAlpha=.32;ctx.lineCap='butt'}
    if(it.pts.length===1){ctx.beginPath();ctx.arc(it.pts[0][0],it.pts[0][1],w/2,0,Math.PI*2);ctx.fill()}
    else{strokePath(it.pts);ctx.stroke()}
    ctx.globalAlpha=1;
  } else if(it.type==='rect'){ctx.lineWidth=it.size;const[x0,y0,x1,y1]=bbox(it);ctx.beginPath();ctx.roundRect?ctx.roundRect(x0,y0,x1-x0,y1-y0,4):ctx.rect(x0,y0,x1-x0,y1-y0);ctx.stroke()}
  else if(it.type==='ellipse'){ctx.lineWidth=it.size;const[x0,y0,x1,y1]=bbox(it);ctx.beginPath();ctx.ellipse((x0+x1)/2,(y0+y1)/2,Math.max(.5,(x1-x0)/2),Math.max(.5,(y1-y0)/2),0,0,Math.PI*2);ctx.stroke()}
  else if(it.type==='arrow'){
    ctx.lineWidth=it.size;ctx.beginPath();ctx.moveTo(it.x1,it.y1);ctx.lineTo(it.x2,it.y2);ctx.stroke();
    const a=Math.atan2(it.y2-it.y1,it.x2-it.x1),L=Math.max(12,it.size*3.2);
    ctx.beginPath();ctx.moveTo(it.x2,it.y2);ctx.lineTo(it.x2-L*Math.cos(a-.45),it.y2-L*Math.sin(a-.45));ctx.moveTo(it.x2,it.y2);ctx.lineTo(it.x2-L*Math.cos(a+.45),it.y2-L*Math.sin(a+.45));ctx.stroke();
  }
}
const isInk=it=>it.type!=='sticky'&&it.type!=='text';
function selImage(){if(sel.size!==1)return null;const it=S.items.find(i=>sel.has(i.id));return it&&it.type==='image'?it:null}
function handleRect(it){const s=12/S.view.z;return[it.x+it.w-s/2,it.y+it.h-s/2,s]}
function paint(){
  const v=S.view;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR*v.z,0,0,DPR*v.z,DPR*v.x,DPR*v.y);
  if(S.tab==='draw'&&S.boards.draw.template)paintTemplate(S.boards.draw.template);
  if(S.tab==='stickies'&&S.boards.stickies.lanes)paintLanes();
  S.items.forEach(it=>{if(it.type==='image')paintItem(it)});
  S.items.forEach(it=>{if(isInk(it)&&it.type!=='image')paintItem(it)});
  if(action&&action.item&&(action.type==='draw'||action.type==='shape'))paintItem(action.item);
  if(sel.size){
    ctx.setLineDash([5/v.z,4/v.z]);ctx.lineWidth=1.5/v.z;ctx.strokeStyle=COL.accent;const p=5/v.z,boxes=[];
    S.items.forEach(it=>{if(!sel.has(it.id))return;const b=bbox(it);boxes.push(b);if(isInk(it))ctx.strokeRect(b[0]-p,b[1]-p,b[2]-b[0]+2*p,b[3]-b[1]+2*p)});
    if(boxes.length>1){const[a,b,c,d]=unionBox(boxes),q=12/v.z;ctx.setLineDash([]);ctx.globalAlpha=.6;ctx.strokeRect(a-q,b-q,c-a+2*q,d-b+2*q);ctx.globalAlpha=1}
    ctx.setLineDash([]);
    const im=selImage();if(im){const[hx,hy,s]=handleRect(im);ctx.fillStyle=COL.surface;ctx.fillRect(hx,hy,s,s);ctx.lineWidth=2/v.z;ctx.strokeRect(hx,hy,s,s)}
  }
  if(action&&action.type==='lasso'&&action.pts.length>1){ctx.beginPath();action.pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.globalAlpha=.08;ctx.fillStyle=COL.accent;ctx.fill();ctx.globalAlpha=1;ctx.setLineDash([6/v.z,4/v.z]);ctx.lineWidth=1.5/v.z;ctx.strokeStyle=COL.accent;ctx.stroke();ctx.setLineDash([])}
  if(S.tool==='eraser'&&cursor){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.lineWidth=1.5;ctx.strokeStyle=COL.muted;ctx.beginPath();ctx.arc(cursor.x,cursor.y,eraserR()*v.z,0,Math.PI*2);ctx.stroke()}
}
const eraserR=()=>({2:8,5:14,10:26}[S.props.size]||14)/S.view.z;

/* ---------- whiteboard templates ---------- */
const TPLS={
  matrix:{name:'Priority matrix',desc:'Urgent vs important, four boxes',box:[-60,0,900,960]},
  week:{name:'Week planner',desc:'Monday to Friday columns with a focus strip',box:[0,0,1264,830]},
  agenda:{name:'Meeting agenda',desc:'Attendees, agenda, notes, decisions, actions',box:[0,0,760,1080]},
  retro:{name:'Retro',desc:'Went well, to improve, actions',box:[0,0,1100,760]}
};
function bgBox(){if(S.tab==='draw'&&S.boards.draw.template)return TPLS[S.boards.draw.template].box;if(S.tab==='stickies'&&S.boards.stickies.lanes)return[0,0,LANE.w*3+LANE.gap*2,900];return null}
function tplText(t,x,y,size,color,weight){ctx.font=`${weight||700} ${size}px "Bricolage Grotesque", system-ui, sans-serif`;ctx.fillStyle=color||COL.muted;ctx.fillText(t,x,y)}
function tplBox(x,y,w,h,tint){
  ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,10):ctx.rect(x,y,w,h);
  if(tint){ctx.globalAlpha=.07;ctx.fillStyle=tint;ctx.fill();ctx.globalAlpha=1}
  ctx.lineWidth=1.5;ctx.strokeStyle=COL.line;ctx.stroke();
}
function paintTemplate(k){
  ctx.save();ctx.lineCap='butt';
  if(k==='matrix'){
    tplText('Priority matrix',0,34,26,COL.fg,800);
    const s=420,x0=0,y0=90;
    [[0,0,'Do first','Urgent and important',COL.red],[1,0,'Schedule','Important, not urgent',COL.blue],[0,1,'Delegate','Urgent, not important',COL.orange],[1,1,'Drop','Neither urgent nor important',COL.muted]]
      .forEach(([c,r,t,d,col])=>{const x=x0+c*(s+16),y=y0+r*(s+16);tplBox(x,y,s,s,col);tplText(t,x+18,y+38,22,col,800);tplText(d,x+18,y+62,14,COL.muted,600)});
    tplText('URGENT',x0+s/2-30,y0-12,12,COL.muted);tplText('NOT URGENT',x0+s+16+s/2-44,y0-12,12,COL.muted);
    ctx.save();ctx.translate(x0-16,y0+s/2+40);ctx.rotate(-Math.PI/2);tplText('IMPORTANT',0,0,12,COL.muted);ctx.restore();
    ctx.save();ctx.translate(x0-16,y0+s+16+s/2+56);ctx.rotate(-Math.PI/2);tplText('NOT IMPORTANT',0,0,12,COL.muted);ctx.restore();
  } else if(k==='week'){
    tplText('Week planner',0,34,26,COL.fg,800);
    const cw=240,g=16,tw=cw*5+g*4;
    tplBox(0,60,tw,90,COL.blue);tplText("This week's focus",18,92,16,COL.blue,800);
    ['Monday','Tuesday','Wednesday','Thursday','Friday'].forEach((d,i)=>{const x=i*(cw+g);tplBox(x,170,cw,650);tplText(d,x+16,202,17,COL.fg,800);ctx.beginPath();ctx.moveTo(x+12,218);ctx.lineTo(x+cw-12,218);ctx.strokeStyle=COL.line;ctx.lineWidth=1;ctx.stroke()});
  } else if(k==='agenda'){
    tplText('Meeting agenda',0,34,26,COL.fg,800);
    let y=60;[['Meeting and date',80],['Attendees',90],['Agenda',220],['Notes',250],['Decisions',140],['Action items',180]].forEach(([t,h],i)=>{tplBox(0,y,760,h,i===5?COL.green:null);tplText(t,18,y+30,16,i===5?COL.green:COL.fg,800);y+=h+12});
  } else if(k==='retro'){
    tplText('Retro',0,34,26,COL.fg,800);
    [['Went well',COL.green],['To improve',COL.orange],['Actions',COL.blue]].forEach(([t,c],i)=>{const x=i*372;tplBox(x,60,356,700,c);tplText(t,x+18,98,20,c,800)});
  }
  ctx.restore();
}
function openTemplates(){

    <div class="tpl-grid">${Object.entries(TPLS).map(([k,t])=>`<button data-m="tpl-${k}" aria-pressed="${cur===k}"><b>${t.name}</b><span>${t.desc}</span></button>`).join('')}
    <button data-m="tpl-" aria-pressed="${!cur}"><b>None</b><span>Plain dotted board</span></button></div>

/* ---------- kanban lanes ---------- */
const LANE={w:260,gap:24,h:2000,names:['To do','Doing','Done']};
const laneX=i=>i*(LANE.w+LANE.gap);
function laneOf(it){const cx=it.x+it.w/2;for(let i=0;i<3;i++)if(cx>=laneX(i)&&cx<laneX(i)+LANE.w)return i;return -1}
function laneCount(i,except){return S.items.filter(s=>s.type==='sticky'&&s!==except&&laneOf(s)===i).length}
function paintLanes(){
  ctx.save();
  LANE.names.forEach((n,i)=>{
    const x=laneX(i);ctx.beginPath();ctx.roundRect?ctx.roundRect(x,0,LANE.w,LANE.h,12):ctx.rect(x,0,LANE.w,LANE.h);
    ctx.globalAlpha=.55;ctx.fillStyle=COL.surface;ctx.fill();ctx.globalAlpha=1;ctx.lineWidth=1.5;ctx.strokeStyle=COL.line;ctx.stroke();
    tplText(n,x+18,34,18,i===2?COL.green:COL.fg,800);
    const nw=ctx.measureText(n).width;ctx.font='500 13px "JetBrains Mono", monospace';ctx.fillStyle=COL.muted;ctx.fillText(String(laneCount(i)),x+28+nw,34);
  });
  ctx.restore();
}
function toggleLanes(){
  const b=S.boards.stickies;b.lanes=!b.lanes;save();renderProps();
  if(b.lanes){const z=clamp(Math.min(1,(W-160)/(LANE.w*3+LANE.gap*2)),.3,1);S.view={z,x:Math.max(70,(W-(LANE.w*3+LANE.gap*2)*z)/2),y:70};applyView();
    const out=S.items.filter(i=>i.type==='sticky'&&laneOf(i)<0).length;toast(out?'Drag stickies into a lane, or press Tidy to sort them in':'Lanes on. Drop a sticky in Done to tick it off')}
  else draw();
}
function syncLaneDone(it){if(S.tab!=='stickies'||!S.boards.stickies.lanes)return false;const l=laneOf(it);if(l<0)return false;return setDone(it,l===2)}

/* ---------- sticky search ---------- */
let query='',hitIdx=-1;
function hits(){const q=query.trim().toLowerCase();if(!q)return[];return S.boards.stickies.items.filter(i=>i.type==='sticky'&&(i.text||'').toLowerCase().includes(q)).sort((a,b)=>a.y-b.y||a.x-b.x)}
function applySearch(){
  if(S.tab!=='stickies')return;const q=query.trim(),hs=hits(),ids=new Set(hs.map(h=>h.id));
  layer.querySelectorAll('.sticky').forEach(el=>{el.classList.toggle('dim',!!q&&!ids.has(el.dataset.id));el.classList.toggle('hit',!!q&&ids.has(el.dataset.id))});

function segD(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}

function openArchive(){
  const doneN=S.boards.stickies.items.filter(i=>i.done).length;
  const groups=[];S.archive.slice().sort((a,b)=>(b.doneAt||b.archivedAt)-(a.doneAt||a.archivedAt)).forEach(a=>{const l=dayLabel(a.doneAt||a.archivedAt);let g=groups.find(x=>x.l===l);if(!g){g={l,items:[]};groups.push(g)}g.items.push(a)});

function weekText(){
  const since=Date.now()-7*86400e3,rows=[];
  S.archive.forEach(a=>{const t=a.doneAt||a.archivedAt;if(t>=since)rows.push({t,text:a.text,p:a.pomos})});
  S.boards.stickies.items.forEach(s=>{if(s.done&&s.doneAt&&s.doneAt>=since)rows.push({t:s.doneAt,text:s.text,p:s.pomos})});
  if(!rows.length)return'';
  rows.sort((a,b)=>a.t-b.t);let out='Done in the last 7 days\n',last='';
  rows.forEach(r=>{const l=new Date(r.t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});if(l!==last){out+='\n'+l+'\n';last=l}out+='- '+(r.text||'').replace(/\s*\n\s*/g,' ').trim()+(r.p?` (${r.p} focus session${r.p===1?'':'s'})`:'')+'\n'});
  return out.trim();
}

/* ---------- pomodoro ---------- */
const MODE_NAME={focus:'Focus',short:'Short break',long:'Long break'};
let mode='focus',remaining=S.timer.focus*60,endAt=null,tick=null,lastSec=null;
const total=()=>S.timer[mode]*60;
const fmt=s=>{s=Math.ceil(s);return `${pad(Math.floor(s/60))}:${pad(s%60)}`};
function drawTimer(){
  $('#face').textContent=fmt(remaining);
  $('#ringArc').style.strokeDashoffset=(276.46*(1-remaining/total())).toFixed(2);
  $('#ringArc').style.stroke=mode==='focus'?'var(--accent)':'var(--ok)';
  $('#faceSub').textContent=endAt?(mode==='focus'?'focusing':'on a break'):(remaining<total()?'paused':'ready');
  $('#tGo').textContent=endAt?'Pause':(remaining<total()?'Resume':'Start');
  $('#tTitle').textContent=S.timer.min?`${MODE_NAME[mode]} ${fmt(remaining)}`:'Pomodoro';
  $('#timer').classList.toggle('run',!!endAt);
  const n=S.sessions[today()]||0,c=n%4;
  $('#cycle').innerHTML=[0,1,2,3].map(i=>`<i class="${i<c?'on':''}"></i>`).join('')+`<span>&nbsp;${n} focus session${n===1?'':'s'} today</span>`;
  markFocusing();
}
function setMode(m,autostart){mode=m;endAt=null;clearInterval(tick);remaining=total();lastSec=null;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));drawTimer();if(autostart)start(true)}
function start(quiet){
  audio();
  if(S.timer.sound&&!quiet)SFX.start();
  endAt=Date.now()+remaining*1000;clearInterval(tick);lastSec=Math.ceil(remaining);
  tick=setInterval(()=>{
    remaining=Math.max(0,(endAt-Date.now())/1000);if(remaining<=0){finish();return}
    const sec=Math.ceil(remaining);
    if(sec!==lastSec){lastSec=sec;
      if(sec<=3&&S.timer.sound)SFX.count();
      else if(mode==='focus'&&S.timer.tick)SFX.tick(sec%2);
    }
    drawTimer()},100);
  drawTimer();
}
function finish(){
  clearInterval(tick);endAt=null;
  if(mode==='focus'){if(S.timer.sound)SFX.focusEnd();const d=today();S.sessions[d]=(S.sessions[d]||0)+1;
    const st=S.timer.sticky&&S.boards.stickies.items.find(i=>i.id===S.timer.sticky);
    if(st){st.pomos=(st.pomos||0)+1;const el=S.tab==='stickies'&&layer.querySelector(`[data-id="${st.id}"]`);if(el){el.querySelector('.tally').textContent=tallyText(st.pomos);el.querySelector('textarea').style.paddingBottom='24px'}}
    save();renderWeek();const lbl=S.timer.label?` on "${S.timer.label}"`:'';toast(`Focus session done${lbl}. Take a break.`);setMode(S.sessions[d]%4===0?'long':'short',S.timer.auto)}
  else{if(S.timer.sound)SFX.breakEnd();toast('Break over. Back to it.');setMode('focus',S.timer.auto)}
}
function focusSticky(it){
  const first=(it.text||'').split('\n').map(s=>s.trim()).find(Boolean)||'Untitled sticky';
  S.timer.label=first.slice(0,80);S.timer.sticky=it.id;$('#tLabel').value=S.timer.label;save();
  if(S.timer.min){S.timer.min=false;applyMin()}
  setMode('focus');start();toast('Focusing on: '+S.timer.label);

let lastFoc='';
function markFocusing(){const id=(endAt&&mode==='focus'&&S.timer.sticky)||'';if(id===lastFoc)return;lastFoc=id;layer.querySelectorAll('.sticky').forEach(el=>el.classList.toggle('focusing',!!id&&el.dataset.id===id))}
function renderWeek(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const vals=days.map(d=>S.sessions[dkey(d)]||0),mx=Math.max(4,...vals),tot=vals.reduce((a,b)=>a+b,0);
  $('#week').innerHTML=`<div class="label" style="text-align:center">Last 7 days · ${tot} session${tot===1?'':'s'}</div><div class="week-bars">${days.map((d,i)=>`<div class="${i===6?'today':''}" title="${d.toLocaleDateString('en-GB',{weekday:'long'})}: ${vals[i]}"><b style="height:${Math.max(3,vals[i]/mx*30)}px"></b>${'SMTWTFS'[d.getDay()]}</div>`).join('')}</div>`;
}
$('#tGo').onclick=()=>{if(endAt){remaining=Math.max(0,(endAt-Date.now())/1000);endAt=null;clearInterval(tick);if(S.timer.sound)SFX.pause();drawTimer()}else start()};
$('#tReset').onclick=()=>setMode(mode);
$('#tSkip').onclick=()=>{const n=S.sessions[today()]||0;setMode(mode==='focus'?((n+1)%4===0?'long':'short'):'focus')};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('#tMinBtn').onclick=()=>{S.timer.min=!S.timer.min;applyMin();save()};
function applyMin(){
  $('#timer').classList.toggle('min',S.timer.min);
  $('#tMinBtn').innerHTML=S.timer.min?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
  $('#tMinBtn').setAttribute('aria-label',S.timer.min?'Expand timer':'Collapse timer');$('#tSetBtn').hidden=S.timer.min;
  drawTimer();placeTimer();
}
$('#tSetBtn').onclick=()=>{$('#tSet').hidden=!$('#tSet').hidden;placeTimer()};
function syncTimerSettings(){$('#dFocus').value=S.timer.focus;$('#dShort').value=S.timer.short;$('#dLong').value=S.timer.long;$('#dAuto').checked=S.timer.auto;$('#dSound').checked=S.timer.sound;$('#dTick').checked=S.timer.tick;$('#dVol').value=S.sound.vol;$('#tLabel').value=S.timer.label||'';applyMin()}
['dFocus','dShort','dLong'].forEach(id=>$('#'+id).addEventListener('change',e=>{const k={dFocus:'focus',dShort:'short',dLong:'long'}[id];const v=clamp(Math.round(+e.target.value||1),1,180);S.timer[k]=v;e.target.value=v;save();if(!endAt&&mode===k)setMode(k);else drawTimer()}));
$('#dAuto').onchange=e=>{S.timer.auto=e.target.checked;save()};
$('#dSound').onchange=e=>{S.timer.sound=e.target.checked;save();if(e.target.checked)SFX.start()};
$('#dTick').onchange=e=>{S.timer.tick=e.target.checked;save();if(e.target.checked){SFX.tick(0);setTimeout(()=>SFX.tick(1),500)}};
$('#dVol').oninput=e=>{S.sound.vol=+e.target.value;save()};
$('#dVol').onchange=()=>SFX.done();
$('#tLabel').oninput=e=>{S.timer.label=e.target.value;S.timer.sticky=null;save();drawTimer()};

/* timer dragging */
function placeTimer(){
  const t=$('#timer');
  if(!S.timer.pos){t.style.left='';t.style.top='';t.style.right='';t.style.bottom='';return}
  const w=t.offsetWidth,h=t.offsetHeight;
  const x=clamp(S.timer.pos.x,8,Math.max(8,W-w-8)),y=clamp(S.timer.pos.y,8,Math.max(8,H-h-8));
  t.style.left=x+'px';t.style.top=y+'px';t.style.right='auto';t.style.bottom='auto';
}
$('#tHead').addEventListener('pointerdown',e=>{
  if(e.target.closest('button'))return;
  e.preventDefault();const head=e.currentTarget,t=$('#timer');head.setPointerCapture(e.pointerId);
  const r=t.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;let moved=false;
  const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<3)return;moved=true;t.classList.add('dragging');S.timer.pos={x:ev.clientX-R.left-ox,y:ev.clientY-R.top-oy};placeTimer()};
  const up=()=>{head.removeEventListener('pointermove',mv);head.removeEventListener('pointerup',up);head.removeEventListener('pointercancel',up);t.classList.remove('dragging');
    if(moved){const b=t.getBoundingClientRect();S.timer.pos={x:b.left-R.left,y:b.top-R.top};save()}else if(S.timer.min){S.timer.min=false;applyMin();save()}};
  head.addEventListener('pointermove',mv);head.addEventListener('pointerup',up);head.addEventListener('pointercancel',up);
});

/* ---------- boot ---------- */
readColors();renderSnd();
document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));
stage.dataset.tab=S.tab;stage.dataset.tool=S.tool;
renderRail();renderProps();renderLayer();resize();updEmpty();updUndo();syncTimerSettings();setMode('focus');renderWeek();
document.fonts&&document.fonts.ready.then(()=>{draw();placeTimer()});
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();renderWeek();if(S.tab==='stickies')renderLayer()}},60000);
})();
</script>

</body></html>
